plugins {
    id 'com.android.application'
}

android {
    namespace 'de.wirzwei.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.wirzwei.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('wirzwei.jks')
            storePassword 'wirzwei-love'
            keyAlias 'wirzwei'
            keyPassword 'wirzwei-love'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
