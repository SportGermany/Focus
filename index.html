<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Navy Focus</title>
<meta name="theme-color" content="#0B132B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B132B'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%235BC0BE' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root{
    --bg-main:#0B132B;
    --bg-surface:#1C2541;
    --border-color:#3A506B;
    --accent-primary:#5BC0BE;
    --accent-secondary:#6FFFE9;
    --text-main:#E0E6ED;
    --text-muted:#8D99AE;
    --correct:#2E7D32;
    --incorrect:#C62828;
    --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Fira Code", "Courier New", monospace;
    --nav-h: 68px;
    --header-h: 60px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --ease: cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(93,120,150,0.16) 1px, transparent 0) 0 0/22px 22px,
      var(--bg-main);
    color:var(--text-main);
    font-family:var(--font-main);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;
    line-height:1.45;
  }
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--accent-primary);color:var(--bg-main);}
  :focus-visible{outline:2px solid var(--accent-secondary);outline-offset:2px;border-radius:2px;}
  a{color:var(--accent-primary);}
  h1,h2,h3,h4{letter-spacing:-0.01em;}

  /* ---------- App Shell ---------- */
  #app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header.topbar{
    height:var(--header-h);
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(28,37,65,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border-color);
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:600;
    letter-spacing:-0.01em;
    font-size:15.5px;
  }
  .brand-mark{width:22px;height:22px;flex:0 0 auto;}
  .brand-mark circle{fill:none;stroke:var(--accent-primary);stroke-width:2;}
  .brand-mark circle.inner{stroke:var(--accent-secondary);stroke-dasharray:2 4;}
  .brand-name{white-space:nowrap;}
  .brand-name .muted-part{color:var(--text-muted);font-weight:400;}

  .topbar-right{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .status-pill{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11.5px;
    color:var(--text-muted);
    padding:5px 11px 5px 9px;
    border:1px solid var(--border-color);
    border-radius:20px;
  }
  .status-pill .led{
    width:6px;height:6px;border-radius:50%;
    background:var(--correct);
    box-shadow:0 0 0 3px rgba(46,125,50,0.18);
  }
  .status-pill.offline .led{background:var(--incorrect);box-shadow:0 0 0 3px rgba(198,40,40,0.18);}
  .status-pill.offline .label::after{content:"Offline";}
  .status-pill:not(.offline) .label::after{content:"Online";}

  .timer-widget{
    display:flex;
    align-items:center;
    gap:9px;
    cursor:pointer;
    padding:5px 10px 5px 5px;
    border-radius:20px;
    border:1px solid transparent;
    transition:border-color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .timer-widget:hover{border-color:var(--border-color);background:rgba(255,255,255,0.02);}
  .timer-ring{width:32px;height:32px;flex:0 0 auto;}
  .timer-ring circle{fill:none;stroke-width:2.5;}
  .timer-ring .track{stroke:var(--border-color);}
  .timer-ring .progress{stroke:var(--accent-primary);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke 0.4s ease;}
  .timer-ring.done .progress{stroke:var(--accent-secondary);}
  .timer-label{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-muted);min-width:36px;letter-spacing:0.02em;}

  .icon-btn{
    background:transparent;
    border:1px solid var(--border-color);
    color:var(--text-main);
    width:32px;height:32px;
    border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
    transition:border-color 0.2s var(--ease), color 0.2s var(--ease);
  }
  .icon-btn:hover{border-color:var(--accent-primary);color:var(--accent-primary);}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;}

  /* ---------- Layout: sidebar (desktop) / bottom nav (mobile) ---------- */
  .body-row{
    display:flex;
    flex:1 1 auto;
    min-height:0;
  }
  nav.sidenav{
    width:232px;
    flex:0 0 auto;
    background:var(--bg-surface);
    border-right:1px solid var(--border-color);
    padding:26px 14px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .nav-heading{
    font-size:11px;
    color:var(--text-muted);
    padding:0 12px 10px 16px;
  }
  .nav-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px 10px 16px;
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    color:var(--text-muted);
    background:transparent;
    border:none;
    text-align:left;
    font-size:13.5px;
    width:100%;
    transition:color 0.2s var(--ease), transform 0.2s var(--ease);
  }
  .nav-item::before{
    content:"";
    position:absolute;
    left:0;top:8px;bottom:8px;
    width:2px;
    background:transparent;
    border-radius:2px;
    transition:background 0.2s var(--ease);
  }
  .nav-item svg{width:17px;height:17px;stroke:currentColor;flex:0 0 auto;opacity:0.85;}
  .nav-item:hover{color:var(--text-main);transform:translateX(1px);}
  .nav-item.active{color:var(--accent-primary);}
  .nav-item.active::before{background:var(--accent-primary);}

  main.content{
    flex:1 1 auto;
    overflow-y:auto;
    padding:36px 24px 90px 24px;
  }
  .container{
    max-width:760px;
    margin:0 auto;
  }

  nav.bottomnav{
    display:none;
    position:fixed;
    bottom:0;left:0;right:0;
    height:var(--nav-h);
    background:rgba(28,37,65,0.96);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--border-color);
    z-index:50;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottomnav .row{
    display:flex;
    height:var(--nav-h);
  }
  nav.bottomnav .nav-item{
    flex:1 1 0;
    flex-direction:column;
    gap:4px;
    align-items:center;
    justify-content:center;
    font-size:10px;
    border-radius:0;
    padding:8px 2px 6px 2px;
  }
  nav.bottomnav .nav-item::before{
    left:50%;top:2px;bottom:auto;
    width:16px;height:2px;
    transform:translateX(-50%);
  }
  nav.bottomnav .nav-item:hover{transform:none;}

  @media (max-width: 800px){
    nav.sidenav{display:none;}
    nav.bottomnav{display:block;}
    main.content{padding:24px 16px calc(var(--nav-h) + 24px) 16px;}
  }

  /* ---------- Cards / common ---------- */
  .card{
    background:var(--bg-surface);
    border:1px solid var(--border-color);
    border-radius:var(--radius-md);
    padding:20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:14px;
  }
  h1.page-title{
    font-size:22px;
    font-weight:600;
    margin-bottom:5px;
  }
  p.page-sub{
    color:var(--text-muted);
    font-size:13.5px;
    margin-bottom:26px;
    max-width:56ch;
    line-height:1.55;
  }
  .section-gap{margin-top:26px;}

  .progress-bar-track{
    height:5px;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    border-radius:4px;
    overflow:hidden;
    margin-top:9px;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--accent-primary);
    transition:width 0.6s var(--ease);
  }
  .card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .card-title h3{font-size:14px;font-weight:600;}
  .card-title .pct{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;}

  /* ---------- Dashboard hero ---------- */
  .hero{
    display:flex;
    align-items:center;
    gap:28px;
    background:var(--bg-surface);
    border:1px solid var(--border-color);
    border-radius:var(--radius-md);
    padding:26px 28px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .hero-ring-wrap{position:relative;width:112px;height:112px;flex:0 0 auto;}
  .hero-ring-wrap svg{width:112px;height:112px;transform:rotate(-90deg);}
  .hero-ring-wrap circle{fill:none;stroke-width:6;}
  .hero-ring-wrap .track{stroke:var(--bg-main);}
  .hero-ring-wrap .progress{stroke:var(--accent-primary);stroke-linecap:round;transition:stroke-dashoffset 0.7s var(--ease);}
  .hero-ring-num{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
  }
  .hero-ring-num .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
  .hero-ring-num .unit{font-size:11px;color:var(--text-muted);margin-top:-2px;}
  .hero-text{flex:1 1 220px;min-width:200px;}
  .hero-text h2{font-size:16px;font-weight:600;margin-bottom:6px;}
  .hero-text p{font-size:13px;color:var(--text-muted);line-height:1.55;}

  .module-list{
    border:1px solid var(--border-color);
    border-radius:var(--radius-md);
    overflow:hidden;
  }
  .module-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    background:var(--bg-surface);
    border-bottom:1px solid var(--border-color);
    cursor:pointer;
    transition:padding-left 0.2s var(--ease), background 0.2s var(--ease);
  }
  .module-row:last-child{border-bottom:none;}
  .module-row:hover{padding-left:22px;background:rgba(91,192,190,0.05);}
  .module-row .accent-tick{
    width:3px;height:30px;border-radius:2px;
    background:var(--tick-color, var(--accent-primary));
    flex:0 0 auto;
  }
  .module-row .icon-wrap{
    width:34px;height:34px;flex:0 0 auto;
    border:1px solid var(--border-color);
    border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
  }
  .module-row .icon-wrap svg{width:17px;height:17px;stroke:var(--text-muted);}
  .module-row .row-main{flex:1 1 auto;min-width:0;}
  .module-row .row-main h3{font-size:14px;font-weight:600;margin-bottom:6px;}
  .module-row .row-main .progress-bar-track{margin-top:0;max-width:220px;}
  .module-row .row-pct{
    font-size:13px;
    font-variant-numeric:tabular-nums;
    color:var(--text-muted);
    flex:0 0 auto;
    min-width:38px;
    text-align:right;
  }

  .btn{
    background:var(--accent-primary);
    color:#062825;
    border:1px solid var(--accent-primary);
    padding:10px 18px;
    border-radius:var(--radius-sm);
    font-weight:600;
    font-size:13.5px;
    letter-spacing:0.01em;
    transition:filter 0.2s var(--ease), transform 0.15s var(--ease);
  }
  .btn:hover{filter:brightness(1.1);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{
    background:transparent;
    color:var(--text-main);
    border:1px solid var(--border-color);
  }
  .btn.secondary:hover{border-color:var(--accent-primary);color:var(--accent-primary);filter:none;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

  .tabs{display:flex;gap:22px;margin-bottom:24px;flex-wrap:wrap;border-bottom:1px solid var(--border-color);}
  .tab-btn{
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--text-muted);
    padding:0 0 11px 0;
    font-size:13.5px;
    border-radius:0;
    margin-bottom:-1px;
    transition:color 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .tab-btn:hover{color:var(--text-main);}
  .tab-btn.active{color:var(--accent-primary);border-bottom-color:var(--accent-primary);font-weight:600;}

  .quiz-question{font-size:16px;line-height:1.55;margin-bottom:20px;}
  .options{display:flex;flex-direction:column;gap:9px;}
  .option-btn{
    text-align:left;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    color:var(--text-main);
    padding:11px 14px;
    border-radius:var(--radius-sm);
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:12px;
    transition:border-color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .option-btn .opt-letter{
    color:var(--accent-primary);
    font-weight:600;
    font-size:11.5px;
    width:20px;height:20px;flex:0 0 auto;
    border:1px solid var(--border-color);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .option-btn:hover:not(:disabled){border-color:var(--accent-primary);}
  .option-btn:hover:not(:disabled) .opt-letter{border-color:var(--accent-primary);}
  .option-btn.correct{border-color:var(--correct);background:rgba(46,125,50,0.14);}
  .option-btn.correct .opt-letter{border-color:var(--correct);color:var(--correct);}
  .option-btn.incorrect{border-color:var(--incorrect);background:rgba(198,40,40,0.14);}
  .option-btn.incorrect .opt-letter{border-color:var(--incorrect);color:var(--incorrect);}
  .option-btn:disabled{cursor:default;}

  .quiz-meta{display:flex;justify-content:space-between;color:var(--text-muted);font-size:11.5px;margin-bottom:14px;letter-spacing:0.02em;}
  .feedback-line{margin-top:16px;font-size:13px;color:var(--text-muted);min-height:18px;}

  textarea, input[type=text]{
    width:100%;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    color:var(--text-main);
    padding:10px 12px;
    border-radius:var(--radius-sm);
    font-family:inherit;
    font-size:14px;
    transition:border-color 0.2s var(--ease);
  }
  textarea:focus, input[type=text]:focus{border-color:var(--accent-primary);}
  select{
    background:var(--bg-main);
    border:1px solid var(--border-color);
    color:var(--text-main);
    padding:9px 10px;
    border-radius:var(--radius-sm);
    font-family:inherit;
    font-size:13.5px;
  }
  label{font-size:11.5px;color:var(--text-muted);display:block;margin-bottom:7px;}

  .mono{font-family:var(--font-mono);}

  table.compare{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px;}
  table.compare th, table.compare td{padding:10px 10px;border-bottom:1px solid var(--border-color);text-align:left;}
  table.compare th{color:var(--text-muted);font-weight:500;font-size:11.5px;}
  table.compare tr:last-child td{border-bottom:none;}

  .verse-box{
    position:relative;
    font-size:18px;
    line-height:1.65;
    padding:26px 28px;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    border-left:2px solid var(--accent-primary);
    border-radius:var(--radius-md);
  }
  .verse-ref{color:var(--accent-primary);font-size:12.5px;margin-top:14px;display:block;letter-spacing:0.02em;}

  .dossier-item{border-top:1px solid var(--border-color);padding:16px 0;}
  .dossier-item:first-child{border-top:none;padding-top:2px;}
  .dossier-item h4{font-size:14px;margin-bottom:7px;color:var(--accent-secondary);font-weight:600;}
  .dossier-item p{font-size:13px;color:var(--text-muted);line-height:1.6;}

  .fact-card-text{
    font-size:17px;
    line-height:1.65;
    padding:22px 4px 6px 4px;
    min-height:80px;
  }
  .facts-list li{
    counter-increment:factnum;
    position:relative;
    padding:12px 0 12px 36px;
    font-size:13.5px;
    line-height:1.55;
    border-top:1px solid var(--border-color);
  }
  .facts-list li:first-child{border-top:none;}
  .facts-list li::before{
    content:counter(factnum);
    position:absolute;
    left:0;top:11px;
    width:22px;height:22px;
    border:1px solid var(--border-color);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    color:var(--accent-primary);
    font-variant-numeric:tabular-nums;
  }

  /* Drive mode */
  .drive-view{
    position:fixed;
    inset:0;
    background:var(--bg-main);
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .drive-status{font-size:13px;color:var(--text-muted);margin-bottom:20px;letter-spacing:0.03em;}
  .drive-question{font-size:23px;line-height:1.5;max-width:600px;margin-bottom:28px;font-weight:500;}
  .drive-mic{
    width:110px;height:110px;
    border-radius:50%;
    background:var(--bg-surface);
    border:2px solid var(--border-color);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:28px;
    transition:border-color 0.3s ease;
  }
  .drive-mic.listening{
    border-color:var(--accent-primary);
    animation:mic-pulse 1.6s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%{box-shadow:0 0 0 0 rgba(91,192,190,0.35);}
    70%{box-shadow:0 0 0 18px rgba(91,192,190,0);}
    100%{box-shadow:0 0 0 0 rgba(91,192,190,0);}
  }
  .drive-mic svg{width:42px;height:42px;stroke:var(--accent-primary);}
  .drive-options-list{font-size:14.5px;color:var(--text-muted);margin-bottom:28px;line-height:1.85;max-width:520px;}
  .drive-close{
    position:absolute;
    top:22px;right:22px;
  }
  .drive-big-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .drive-big-btn{
    min-width:88px;
    padding:20px 26px;
    font-size:19px;
    font-weight:700;
    background:var(--bg-surface);
    border:1px solid var(--border-color);
    color:var(--text-main);
    border-radius:var(--radius-md);
    transition:border-color 0.2s var(--ease);
  }
  .drive-big-btn:hover{border-color:var(--accent-primary);color:var(--accent-primary);}
  .drive-big-btn:active{border-color:var(--accent-primary);}

  /* Settings drawer */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(4,8,20,0.6);
    z-index:90;display:none;
  }
  .drawer-backdrop.open{display:block;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;
    width:min(340px,88vw);
    background:var(--bg-surface);
    border-left:1px solid var(--border-color);
    z-index:91;
    transform:translateX(100%);
    transition:transform 0.25s var(--ease);
    padding:22px;
    overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer h2{font-size:15.5px;margin-bottom:20px;font-weight:600;}
  .drawer .field{margin-bottom:20px;}
  .drawer .close-x{float:right;}

  .hidden{display:none !important;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>

</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><circle class="inner" cx="12" cy="12" r="4.5"></circle></svg>
      <span class="brand-name">Navy <span class="muted-part">Focus</span></span>
    </div>
    <div class="topbar-right">
      <div class="status-pill offline" id="netStatus"><span class="led"></span><span class="label"></span></div>
      <div class="timer-widget" id="timerWidget" title="Fokus-Timer">
        <svg class="timer-ring" id="timerRing" viewBox="0 0 36 36">
          <circle class="track" cx="18" cy="18" r="15.5"></circle>
          <circle class="progress" id="timerProgress" cx="18" cy="18" r="15.5" stroke-dasharray="97.4" stroke-dashoffset="0"></circle>
        </svg>
        <span class="timer-label" id="timerLabel">25:00</span>
      </div>

/* =========================================================
   STATE / STORAGE
   ========================================================= */
var STORAGE_KEY = "navyFocusData_v1";

function defaultState(){
  return {
    progress:{geo:{}, tech:{}, faith:{}, mobility:{}},
    notes:{},
    settings:{}
  };
}

var state = loadState();

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    return {
      progress:Object.assign(d.progress, parsed.progress||{}),
      notes:Object.assign(d.notes, parsed.notes||{}),
      settings:Object.assign(d.settings, parsed.settings||{})
    };
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* storage unavailable, ignore silently */ }
}

function markAnswered(cat, id, wasCorrect){
  if(!state.progress[cat]) state.progress[cat] = {};
  state.progress[cat][id] = !!wasCorrect;
  saveState();
  renderNav();
}

function categoryPct(cat){
  var qs = DATA[cat] || [];
  if(qs.length === 0) return 0;
  var solved = 0;
  var p = state.progress[cat] || {};
  qs.forEach(function(q){ if(p[q.id] === true) solved++; });
  return Math.round((solved/qs.length)*100);
}

/* =========================================================
   ROUTER
   ========================================================= */
var currentRoute = "dashboard";

function navigate(route){
  if(window.__factsPlaying){ window.__factsPlaying = false; if(speechSupported) window.speechSynthesis.cancel(); }
  if(route === "drive"){
    openDriveMode();
    return;
  }
  currentRoute = route;
  render();
  renderNav();
  document.querySelector("main.content").scrollTop = 0;
}

/* =========================================================
   NAV RENDERING
   ========================================================= */
function navItemHtml(cat, extraClass){
  var active = (currentRoute === cat.key) ? " active":"";
  return '<button class="nav-item'+active+' '+(extraClass||'')+'" data-route="'+cat.key+'">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[cat.icon]+'</svg>'+
    '<span>'+cat.label+'</span></button>';
}

function renderNav(){
  var side = document.getElementById("sidenav");
  var bottom = document.getElementById("bottomnavRow");
  side.innerHTML = '<div class="nav-heading">Bereiche</div>'+CATEGORIES.map(function(c){ return navItemHtml(c); }).join("");
  bottom.innerHTML = CATEGORIES.map(function(c){ return navItemHtml(c); }).join("");
  document.querySelectorAll(".nav-item").forEach(function(btn){
    btn.addEventListener("click", function(){ navigate(btn.getAttribute("data-route")); });
  });
}

/* =========================================================
   RENDER: MAIN CONTENT
   ========================================================= */
function render(){
  var root = document.getElementById("contentRoot");
  if(currentRoute === "dashboard") root.innerHTML = renderDashboard();
  else if(currentRoute === "geo") root.innerHTML = renderGeoModule();
  else if(currentRoute === "tech") root.innerHTML = renderTechModule();
  else if(currentRoute === "faith") root.innerHTML = renderFaithModule();
  else if(currentRoute === "mobility") root.innerHTML = renderMobilityModule();
  bindContentEvents();
}

function overallPct(){
  var cats = ["geo","tech","faith","mobility"];
  var total = 0, solved = 0;
  cats.forEach(function(c){
    var qs = DATA[c] || [];
    var p = state.progress[c] || {};
    total += qs.length;
    qs.forEach(function(q){ if(p[q.id] === true) solved++; });
  });
  return total === 0 ? 0 : Math.round((solved/total)*100);
}

function renderDashboard(){
  var cats = [
    {key:"geo", label:"Geopolitik & Weltwissen", icon:"globe"},
    {key:"tech", label:"Tech, Linux & Networking", icon:"terminal"},
    {key:"faith", label:"Glaube & Bibel", icon:"book"},
    {key:"mobility", label:"Mobilität & Drohnenrecht", icon:"bike"}
  ];
  var pct = overallPct();
  var RING_R = 50, RING_C = 2*Math.PI*RING_R;
  var offset = RING_C*(1-pct/100);

  var rows = cats.map(function(c){
    var p = categoryPct(c.key);
    return '<div class="module-row" data-route="'+c.key+'" style="--tick-color:var(--accent-primary)">'+
      '<div class="accent-tick"></div>'+
      '<div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[c.icon]+'</svg></div>'+
      '<div class="row-main"><h3>'+c.label+'</h3><div class="progress-bar-track"><div class="progress-bar-fill" style="width:'+p+'%;"></div></div></div>'+
      '<div class="row-pct">'+p+'%</div>'+
    '</div>';
  }).join("");

  return '<h1 class="page-title">Dashboard</h1>'+
    '<p class="page-sub">Ruhiger Überblick über deinen Lernfortschritt. Keine Streaks, keine Coins.</p>'+
    '<div class="hero">'+
      '<div class="hero-ring-wrap">'+
        '<svg viewBox="0 0 120 120">'+
          '<circle class="track" cx="60" cy="60" r="'+RING_R+'"></circle>'+
          '<circle class="progress" cx="60" cy="60" r="'+RING_R+'" stroke-dasharray="'+RING_C.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'"></circle>'+
        '</svg>'+
        '<div class="hero-ring-num"><span class="num">'+pct+'%</span><span class="unit">gemeistert</span></div>'+
      '</div>'+
      '<div class="hero-text">'+
        '<h2>Gesamtfortschritt über alle Module</h2>'+
        '<p>Basierend auf allen beantworteten Fragen in Geopolitik, Tech, Glaube und Mobilität. Öffne ein Modul unten, um weiterzumachen.</p>'+
      '</div>'+
    '</div>'+
    '<div class="module-list">'+rows+'</div>'+
    '<div class="section-gap card">'+
      '<div class="card-title"><h3>Audio-Fahrtmodus</h3></div>'+
      '<p style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Fragen laut vorlesen lassen und per Sprache antworten &mdash; ideal für unterwegs.</p>'+
      '<button class="btn" id="dashDriveBtn">Fahrtmodus starten</button>'+
    '</div>';
}

  if(!window.__quizRuntime[cat]) window.__quizRuntime[cat] = {index:0, answered:false};
  return window.__quizRuntime[cat];
}

function renderQuizCard(cat){
  var qs = DATA[cat];
  var rt = quizState(cat);
  if(rt.index >= qs.length) rt.index = 0;
  var q = qs[rt.index];
  var letters = ["A","B","C","D"];
  var optsHtml = q.opts.map(function(opt, i){
    return '<button class="option-btn" data-opt="'+i+'" data-cat="'+cat+'"><span class="opt-letter">'+letters[i]+'</span><span>'+opt+'</span></button>';
  }).join("");
  return '<div class="card" id="quizCard-'+cat+'">'+
    '<div class="quiz-meta"><span>Frage '+(rt.index+1)+' / '+qs.length+'</span><span>'+categoryPct(cat)+'% gemeistert</span></div>'+
    '<div class="quiz-question">'+q.q+'</div>'+
    '<div class="options">'+optsHtml+'</div>'+
    '<div class="feedback-line" id="feedback-'+cat+'"></div>'+
    '<div class="btn-row"><button class="btn secondary" data-next="'+cat+'">Nächste Frage</button></div>'+
  '</div>';
}

function handleOptionClick(cat, idx, btnEl){
  var rt = quizState(cat);
  if(rt.answered) return;
  rt.answered = true;
  var q = DATA[cat][rt.index];
  var card = document.getElementById("quizCard-"+cat);
  var buttons = card.querySelectorAll(".option-btn");
  buttons.forEach(function(b, i){
    b.disabled = true;
    if(i === q.correct) b.classList.add("correct");
    else if(i === idx && idx !== q.correct) b.classList.add("incorrect");
  });
  var correct = (idx === q.correct);
  markAnswered(cat, q.id, correct);
  var fb = document.getElementById("feedback-"+cat);
  fb.textContent = correct ? "Richtig!" : ("Falsch. Richtig war: "+q.opts[q.correct]);
  var pctSpan = card.querySelector(".quiz-meta span:last-child");
  if(pctSpan) pctSpan.textContent = categoryPct(cat)+"% gemeistert";
}

function nextQuestion(cat){
  var rt = quizState(cat);
  rt.index = (rt.index + 1) % DATA[cat].length;
  rt.answered = false;
  var container = document.getElementById("quizContainer-"+cat);
  if(container) container.innerHTML = renderQuizCard(cat);
}

/* ---------- Lernablauf: erst 10 Fakten, dann 2 Kontrollfragen ---------- */
function learnState(cat){
  if(!window.__learnState) window.__learnState = {};
  if(!window.__learnState[cat]) window.__learnState[cat] = {stage:"facts"};
  return window.__learnState[cat];
}

function conceptQuizState(cat){
  if(!window.__conceptRuntime) window.__conceptRuntime = {};
  if(!window.__conceptRuntime[cat]) window.__conceptRuntime[cat] = {index:0, answered:false};
  return window.__conceptRuntime[cat];
}

function renderLearnFlow(cat){
  var ls = learnState(cat);
  if(ls.stage === "quiz") return renderConceptQuiz(cat);

  var facts = FACTS[cat];
  if(ls.factIndex === undefined) ls.factIndex = 0;
  var idx = ls.factIndex;
  var isLast = idx === facts.length - 1;
  var playing = !!window.__factsPlaying && window.__factsPlayingCat === cat;

  return '<div class="card">'+
    '<div class="quiz-meta"><span>Fakt '+(idx+1)+' / '+facts.length+'</span><span>Lernkarte</span></div>'+
    '<div class="fact-card-text">'+facts[idx]+'</div>'+
    '<div class="btn-row">'+
      '<button class="btn secondary" id="factsReadBtn" data-cat="'+cat+'">'+(playing?"Vorlesen stoppen":"Vorlesen")+'</button>'+
      (idx > 0 ? '<button class="btn secondary" data-factprev="'+cat+'">Zurück</button>' : '')+
      '<button class="btn" data-factnext="'+cat+'">'+(isLast ? "Weiter zu den 2 Fragen" : "Weiter")+'</button>'+
    '</div>'+
  '</div>';
}

function stopFactsReading(){
  if(window.__factsPlaying){
    window.__factsPlaying = false;
    if(speechSupported) window.speechSynthesis.cancel();
  }
}

function factNext(cat){
  stopFactsReading();
  var ls = learnState(cat);
  var facts = FACTS[cat];
  if(ls.factIndex >= facts.length - 1) ls.stage = "quiz";
  else ls.factIndex++;
  render();
}

function factPrev(cat){
  stopFactsReading();
  var ls = learnState(cat);
  if(ls.factIndex > 0) ls.factIndex--;
  render();
}

function renderConceptQuiz(cat){
  var qs = CONCEPT_QUIZ[cat];
  var rt = conceptQuizState(cat);
  if(rt.index >= qs.length){
    return '<div class="card">'+
      '<div class="card-title"><h3>Geschafft</h3></div>'+
      '<p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">Du hast beide Fragen zu diesen Fakten beantwortet.</p>'+
      '<div class="btn-row"><button class="btn secondary" data-factsrestart="'+cat+'">Fakten noch einmal ansehen</button></div>'+
    '</div>';
  }
  var q = qs[rt.index];
  var letters = ["A","B","C","D"];
  var optsHtml = q.opts.map(function(opt, i){
    return '<button class="option-btn" data-copt="'+i+'" data-ccat="'+cat+'"><span class="opt-letter">'+letters[i]+'</span><span>'+opt+'</span></button>';
  }).join("");
  return '<div class="card" id="conceptQuizCard-'+cat+'">'+
    '<div class="quiz-meta"><span>Kontrollfrage '+(rt.index+1)+' / '+qs.length+'</span><span>zu den 10 Fakten</span></div>'+
    '<div class="quiz-question">'+q.q+'</div>'+
    '<div class="options">'+optsHtml+'</div>'+
    '<div class="feedback-line" id="cfeedback-'+cat+'"></div>'+
  '</div>';
}

function handleConceptOption(cat, idx){
  var rt = conceptQuizState(cat);
  if(rt.answered) return;
  rt.answered = true;
  var q = CONCEPT_QUIZ[cat][rt.index];
  var card = document.getElementById("conceptQuizCard-"+cat);
  var buttons = card.querySelectorAll(".option-btn");
  buttons.forEach(function(b, i){
    b.disabled = true;
    if(i === q.correct) b.classList.add("correct");
    else if(i === idx && idx !== q.correct) b.classList.add("incorrect");
  });
  var correct = (idx === q.correct);
  markAnswered(cat, q.id, correct);
  var fb = document.getElementById("cfeedback-"+cat);
  fb.innerHTML = (correct ? "Richtig!" : ("Falsch. Richtig war: "+q.opts[q.correct])) +
    '<div class="btn-row"><button class="btn secondary" data-cnext="'+cat+'">Weiter</button></div>';
}

function conceptNext(cat){
  var rt = conceptQuizState(cat);
  rt.index++;
  rt.answered = false;
  render();
}

function factsRestart(cat){
  var ls = learnState(cat);
  ls.stage = "facts";
  ls.factIndex = 0;
  window.__conceptRuntime = window.__conceptRuntime || {};
  window.__conceptRuntime[cat] = {index:0, answered:false};
  render();
}

function toggleFactsReading(cat){
  if(window.__factsPlaying && window.__factsPlayingCat === cat){
    stopFactsReading();
    var btn = document.getElementById("factsReadBtn");
    if(btn) btn.textContent = "Vorlesen";
    return;
  }
  var ls = learnState(cat);
  var idx = ls.factIndex || 0;
  window.__factsPlaying = true;
  window.__factsPlayingCat = cat;
  var btn2 = document.getElementById("factsReadBtn");
  if(btn2) btn2.textContent = "Vorlesen stoppen";
  speak(FACTS[cat][idx], function(){
    window.__factsPlaying = false;
    var btn3 = document.getElementById("factsReadBtn");
    if(btn3) btn3.textContent = "Vorlesen";
  });
}

/* =========================================================
   FOCUS TIMER (Pomodoro, 25 min)
   ========================================================= */
var TIMER_TOTAL = 25*60;
var timerRemaining = TIMER_TOTAL;
var timerRunning = false;
var timerInterval = null;
var timerDone = false;
var RING_CIRC = 2*Math.PI*15.5;

function updateTimerDisplay(){
  var m = Math.floor(timerRemaining/60);
  var s = timerRemaining%60;
  document.getElementById("timerLabel").textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  var progressEl = document.getElementById("timerProgress");
  var frac = timerRemaining/TIMER_TOTAL;
  progressEl.setAttribute("stroke-dasharray", RING_CIRC.toFixed(1));
  progressEl.setAttribute("stroke-dashoffset", (RING_CIRC*(1-frac)).toFixed(1));
  document.getElementById("timerRing").classList.toggle("done", timerDone);
}

function tickTimer(){
  if(timerRemaining > 0){
    timerRemaining--;
    if(timerRemaining === 0){
      timerDone = true;
      timerRunning = false;
      clearInterval(timerInterval);
    }
    updateTimerDisplay();
  }
}

function toggleTimer(){
  if(timerDone){
    timerRemaining = TIMER_TOTAL; timerDone = false; timerRunning = false;
    updateTimerDisplay();
    return;
  }
  if(timerRunning){
    timerRunning = false;
    clearInterval(timerInterval);
  } else {
    timerRunning = true;
    timerInterval = setInterval(tickTimer, 1000);
  }
}

document.getElementById("timerWidget").addEventListener("click", toggleTimer);

function speak(text, onEnd){
  if(!speechSupported){ if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  u.rate = 1.0;
  if(onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
}

function openDriveMode(){
  buildDrivePool();
  driveIdx = -1;
  driveView.classList.remove("hidden");
  driveStatusEl.textContent = "Bereit";
  driveQuestionEl.textContent = "Tippe auf Start, um zu beginnen.";
  driveOptionsListEl.textContent = "";
  driveBigBtns.innerHTML = '<button class="drive-big-btn" id="driveStartBtn">Start</button>';
  document.getElementById("driveStartBtn").addEventListener("click", startDriveRound);
}

function closeDriveMode(){
  driveView.classList.add("hidden");
  if(speechSupported) window.speechSynthesis.cancel();
  if(recognizer){ try{ recognizer.stop(); }catch(e){} }
  driveMicEl.classList.remove("listening");
}
document.getElementById("driveClose").addEventListener("click", closeDriveMode);

function nextDriveQuestion(){
  driveIdx = (driveIdx + 1) % driveAllQuestions.length;
  return driveAllQuestions[driveIdx];
}

function startDriveRound(){
  driveBigBtns.innerHTML = "";
  askDriveQuestion();
}

function askDriveQuestion(){
  var q = nextDriveQuestion();
  var letters = ["A","B","C","D"];
  var optText = q.opts.map(function(o,i){ return letters[i]+": "+o; }).join(" · ");
  driveQuestionEl.textContent = q.q;
  driveOptionsListEl.textContent = optText;
  driveStatusEl.textContent = "Frage wird vorgelesen...";
  driveMicEl.classList.remove("listening");

  var fullText = q.q + ". Antwortmöglichkeiten: " + q.opts.map(function(o,i){ return letters[i]+", "+o; }).join(". ");
  speak(fullText, function(){
    startListening(q, letters);
  });
}

function startListening(q, letters){
  if(!recognitionSupported){
    driveStatusEl.textContent = "Spracherkennung nicht verfügbar. Bitte Option antippen.";
    renderDriveManualButtons(q, letters);
    return;
  }
  driveStatusEl.textContent = "Höre zu... sag A, B, C oder D";
  driveMicEl.classList.add("listening");
  var SR = window.webkitSpeechRecognition || window.SpeechRecognition;
  recognizer = new SR();
  recognizer.lang = "de-DE";
  recognizer.continuous = false;
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 3;

  var handled = false;
  recognizer.onresult = function(event){
    if(handled) return;
    var transcript = event.results[0][0].transcript.toLowerCase();
    var mapping = {
      "a":0,"eins":0,"1":0,
      "b":1,"zwei":1,"2":1,
      "c":2,"drei":2,"3":2,
      "d":3,"vier":3,"4":3
    };
    var chosen = null;
    Object.keys(mapping).forEach(function(key){
      if(transcript.indexOf(key) !== -1 && chosen === null) chosen = mapping[key];
    });
    handled = true;
    driveMicEl.classList.remove("listening");
    if(chosen === null){
      driveStatusEl.textContent = "Nicht verstanden: \""+transcript+"\"";
      renderDriveManualButtons(q, letters);
    } else {
      handleDriveAnswer(q, chosen);
    }
  };
  recognizer.onerror = function(){
    handled = true;
    driveMicEl.classList.remove("listening");
    driveStatusEl.textContent = "Fehler bei Spracherkennung. Bitte antippen.";
    renderDriveManualButtons(q, letters);
  };
  recognizer.onend = function(){
    driveMicEl.classList.remove("listening");
    if(!handled) renderDriveManualButtons(q, letters);
  };
  try{ recognizer.start(); }catch(e){
    renderDriveManualButtons(q, letters);
  }
}

function renderDriveManualButtons(q, letters){
  driveBigBtns.innerHTML = letters.map(function(l,i){
    return '<button class="drive-big-btn" data-manual="'+i+'">'+l+'</button>';
  }).join("");
  driveBigBtns.querySelectorAll("[data-manual]").forEach(function(btn){
    btn.addEventListener("click", function(){
      handleDriveAnswer(q, parseInt(btn.getAttribute("data-manual"),10));
    });
  });
}

function handleDriveAnswer(q, chosenIdx){
  var correct = (chosenIdx === q.correct);
  markAnswered(q.cat, q.id, correct);
  driveBigBtns.innerHTML = "";
  var msg = correct ? "Richtig!" : ("Falsch, richtig war Option "+["A","B","C","D"][q.correct]+".");
  driveStatusEl.textContent = msg;
  speak(msg, function(){
    setTimeout(function(){
      if(!driveView.classList.contains("hidden")) askDriveQuestion();
    }, 3000);
  });
}

/* =========================================================
   PWA: MANIFEST + SERVICE WORKER (inline via Blob)
   ========================================================= */
(function setupManifest(){
  var manifest = {
    name:"Navy Focus",
    short_name:"NavyFocus",
    start_url:".",
    display:"standalone",
    background_color:"#0B132B",
    theme_color:"#0B132B",
    icons:[
      {src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230B132B'/%3E%3Ccircle cx='96' cy='96' r='48' fill='none' stroke='%235BC0BE' stroke-width='12'/%3E%3C/svg%3E", sizes:"192x192", type:"image/svg+xml"}
    ]
  };
  var blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var link = document.createElement("link");
  link.rel = "manifest";
  link.href = url;
  document.head.appendChild(link);
})();

(function setupServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  var swSource = [
    "var CACHE_NAME = 'navy-focus-cache-v1';",
    "self.addEventListener('install', function(event){",
    "  event.waitUntil(caches.open(CACHE_NAME).then(function(cache){",
    "    return cache.add(self.registration.scope);",
    "  }).catch(function(){}));",
    "  self.skipWaiting();",
    "});",
    "self.addEventListener('activate', function(event){ self.clients.claim(); });",
    "self.addEventListener('fetch', function(event){",
    "  if(event.request.method !== 'GET') return;",
    "  event.respondWith(",
    "    caches.match(event.request).then(function(cached){",
    "      var fetchPromise = fetch(event.request).then(function(response){",
    "        if(response && response.status === 200){",
    "          var copy = response.clone();",
    "          caches.open(CACHE_NAME).then(function(cache){ cache.put(event.request, copy); });",
    "        }",
    "        return response;",
    "      }).catch(function(){ return cached; });",
    "      return cached || fetchPromise;",
    "    })",
    "  );",
    "});"
  ].join("\\n");
  try{
    var blob = new Blob([swSource], {type:"application/javascript"});
    var swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(function(){ /* offline registration failed silently */ });
  }catch(e){ /* SW setup unsupported, ignore */ }
})();

/* =========================================================
   INIT
   ========================================================= */
function init(){
  renderNav();
  render();
  updateTimerDisplay();
  updateNetStatus();
}
init();

})();
